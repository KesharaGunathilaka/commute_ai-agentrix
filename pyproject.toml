[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commute-agent"
version = "0.1.0"
description = "Disruption-Aware Commute Agent for Sri Lanka Public Transport"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-groq>=0.2.0",
    "langchain-chroma>=0.1.0",
    "google-generativeai>=0.8.0",
    "chromadb>=0.5.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.38.0",
    "googlemaps>=4.10.0",
    "beautifulsoup4>=4.12.0",
    "gtts>=2.5.0",
    "httpx>=0.27.0",
    "rich>=13.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
ingest = "commute_agent.scripts.ingest_timetables:main"
ingest-bus = "commute_agent.rag.ingest_bus_docs:main"
run-agent = "commute_agent.graph.builder:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commute_agent"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
